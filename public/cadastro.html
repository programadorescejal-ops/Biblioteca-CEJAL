<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Biblioteca CEJAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/main.css">
    <style>
        .cadastro-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1565C0, #0D47A1);
            padding: var(--spacing-md);
        }
        .cadastro-container {
            background: white;
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
            max-width: 480px;
            width: 100%;
            box-shadow: var(--shadow-xl);
            max-height: 90vh;
            overflow-y: auto;
        }
        .cadastro-logo {
            text-align: center;
            margin-bottom: var(--spacing-lg);
        }
        .cadastro-logo i {
            font-size: 40px;
            color: var(--primary);
            background: var(--background);
            padding: var(--spacing-md);
            border-radius: var(--radius-full);
        }
        .cadastro-logo h1 {
            font-size: var(--font-size-lg);
            margin-top: var(--spacing-sm);
            color: var(--primary);
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--spacing-sm);
        }
        @media (max-width: 480px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
        .btn-cadastro {
            width: 100%;
            padding: var(--spacing-md);
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: var(--font-size-md);
            font-weight: 600;
            font-family: var(--font-primary);
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        .btn-cadastro:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        .login-links {
            text-align: center;
            margin-top: var(--spacing-md);
        }
        .login-links a {
            color: var(--primary);
            text-decoration: none;
            font-size: var(--font-size-sm);
        }
        .login-links a:hover {
            text-decoration: underline;
        }
        .password-requirements {
            font-size: var(--font-size-xs);
            color: var(--text-light);
            margin-top: var(--spacing-xs);
        }
    </style>
</head>
<body>
    <div class="cadastro-page">
        <div class="cadastro-container">
            <div class="cadastro-logo">
                <i class="fas fa-user-plus"></i>
                <h1>📚 Cadastro</h1>
                <p style="color:var(--text-secondary);font-size:var(--font-size-sm);">Crie sua conta para acessar a biblioteca</p>
            </div>
            
            <form id="cadastroForm" onsubmit="fazerCadastro(event)">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Nome Completo *</label>
                    <input type="text" id="nome" placeholder="Digite seu nome completo" required>
                </div>
                
                <div class="form-group">
                    <label><i class="fas fa-id-card"></i> Matrícula *</label>
                    <input type="text" id="matricula" placeholder="Digite sua matrícula" required>
                    <small class="password-requirements">Ex: 2026001</small>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label><i class="fas fa-graduation-cap"></i> Série *</label>
                        <select id="serie" required>
                            <option value="">Selecione...</option>
                            <option value="6º Ano">6º Ano</option>
                            <option value="7º Ano">7º Ano</option>
                            <option value="8º Ano">8º Ano</option>
                            <option value="9º Ano">9º Ano</option>
                            <option value="1º Ano EM">1º Ano EM</option>
                            <option value="2º Ano EM">2º Ano EM</option>
                            <option value="3º Ano EM">3º Ano EM</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-users"></i> Turma *</label>
                        <select id="turma" required>
                            <option value="">Selecione...</option>
                            <option value="A">A</option>
                            <option value="B">B</option>
                            <option value="C">C</option>
                            <option value="D">D</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Senha *</label>
                    <input type="password" id="senha" placeholder="Mínimo 6 caracteres" required minlength="6">
                    <small class="password-requirements">Mínimo 6 caracteres</small>
                </div>
                
                <div class="form-group">
                    <label><i class="fas fa-check-circle"></i> Confirmar Senha *</label>
                    <input type="password" id="confirmarSenha" placeholder="Digite a senha novamente" required>
                </div>
                
                <button type="submit" class="btn-cadastro">
                    <i class="fas fa-user-plus"></i> Cadastrar
                </button>
            </form>
            
            <div class="login-links">
                <a href="login.html">Já tem conta? Faça login</a>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="js/config/firebase-config.js"></script>
    <script src="js/auth/auth.js"></script>
    <script src="js/utils/helpers.js"></script>
    
    <script>
        async function fazerCadastro(event) {
            event.preventDefault();
            
            const dados = {
                nome: document.getElementById('nome').value.trim(),
                matricula: document.getElementById('matricula').value.trim(),
                serie: document.getElementById('serie').value,
                turma: document.getElementById('turma').value,
                senha: document.getElementById('senha').value,
                confirmarSenha: document.getElementById('confirmarSenha').value
            };
            
            if (!dados.nome || !dados.matricula || !dados.serie || !dados.turma) {
                showToast('Preencha todos os campos', 'error');
                return;
            }
            
            if (dados.senha !== dados.confirmarSenha) {
                showToast('As senhas não coincidem', 'error');
                return;
            }
            
            if (dados.senha.length < 6) {
                showToast('A senha deve ter no mínimo 6 caracteres', 'error');
                return;
            }
            
            const loading = showLoading('Cadastrando...');
            try {
                const result = await authSystem.cadastrarAluno(dados);
                loading.close();
                
                if (result.success) {
                    showToast('✅ Cadastro realizado com sucesso!', 'success');
                    setTimeout(() => window.location.href = 'login.html', 2000);
                } else {
                    showToast('❌ ' + result.error, 'error');
                }
            } catch (error) {
                loading.close();
                showToast('❌ Erro ao cadastrar: ' + error.message, 'error');
            }
        }
    </script>
</body>
</html>
